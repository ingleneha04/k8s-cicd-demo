

name: Local Minikube CD

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to local Minikube
        shell: cmd
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -Command "& { .\deploy-local.ps1; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE } }"
